[package]
name = "bigtext"
version = "0.1.1"
edition = "2021"
description = "Fast text editor for huge files (1-50+ GB): opens instantly, never freezes, streaming search/replace and atomic save"
authors = ["Erkin Pardayev <erkin.pardayev@gmail.com>"]
repository = "https://github.com/Erkinbek/bigtext"
homepage = "https://erkinbek.github.io/bigtext/"
readme = "README.md"
keywords = ["text-editor", "large-files", "log-viewer", "mmap", "egui"]
categories = ["text-editors", "gui"]
license = "MIT"
default-run = "bigtext"
# Only what `cargo install bigtext` needs; the website, test data and CI stay out of the crate.
include = ["/src/", "/build.rs", "/assets/bigtext.ico", "/assets/icon-256.png", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "bigtext"
path = "src/lib.rs"

[[bin]]
name = "bigtext"
path = "src/main.rs"

[[bin]]
name = "gen-testfiles"
path = "src/bin/gen_testfiles.rs"

[[bin]]
name = "bigtext-bench"
path = "src/bin/bench.rs"

[dependencies]
memmap2 = "0.9"
memchr = "2.7"
regex-automata = { version = "0.4", features = ["syntax", "meta", "perf", "unicode"] }
regex-syntax = "0.8"
encoding_rs = "0.8"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "links"] }
egui = "0.36"
rfd = "0.17"
# Update check and install (Help > Check for updates).
ureq = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
