[package]
name = "bigtext"
version = "0.1.0"
edition = "2021"
description = "A fast, non-freezing large-file text editor"
license = "MIT"
default-run = "bigtext"

[lib]
name = "bigtext"
path = "src/lib.rs"

[[bin]]
name = "bigtext"
path = "src/main.rs"

[[bin]]
name = "gen-testfiles"
path = "src/bin/gen_testfiles.rs"

[[bin]]
name = "bigtext-bench"
path = "src/bin/bench.rs"

[dependencies]
memmap2 = "0.9"
memchr = "2.7"
regex-automata = { version = "0.4", features = ["syntax", "meta", "perf", "unicode"] }
regex-syntax = "0.8"
encoding_rs = "0.8"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
