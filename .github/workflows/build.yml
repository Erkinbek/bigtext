name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux builds in a container of the oldest Ubuntu LTS still supported, so the binaries need
    # its glibc (2.35), not the runner's: built on ubuntu-latest (26.04, glibc 2.43) they do not
    # start on Ubuntu 22.04/24.04 or Debian 12/13, and fail the AppImage catalog's test, which
    # runs on the oldest supported LTS. Empty (no container) for Windows and macOS.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - name: linux-x64
            os: ubuntu-latest
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            test: false # cross-compiled on an arm64 runner
    steps:
      # The container is a bare ubuntu:22.04 running as root (no sudo), so besides the libraries
      # it needs the compiler, git for checkout, curl for rustup and appimagetool, zstd for the
      # cache; patchelf and libxkbcommon-x11-0 are for the AppImage, which carries that library.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config git curl ca-certificates \
            file zstd patchelf libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Kept apart from the caches of the old Linux runner, whose build scripts need its glibc.
          key: ${{ matrix.container && format('{0}-{1}', matrix.target, matrix.container) || matrix.target }}

      # The code is formatted with rustfmt's default settings and has no clippy warnings
      # (CONTRIBUTING.md). Formatting is the same everywhere, so it is checked once; clippy runs
      # on each tested platform, since each has code of its own.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.test
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Unit tests
        if: matrix.test
        run: cargo test --lib --target ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/bigtext-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bigtext.exe $out/
          Copy-Item target/${{ matrix.target }}/release/bigtext-cli.exe $out/
          Copy-Item target/${{ matrix.target }}/release/bigtext-bench.exe $out/
          Copy-Item target/${{ matrix.target }}/release/gen-testfiles.exe $out/
          Copy-Item README.md, FEATURES.md, USAGE.md $out/

      - name: Build installer (Windows, optional)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSourceExe="$PWD\target\${{ matrix.target }}\release\bigtext.exe" /O"$PWD\dist" installer\bigtext.iss

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          out="dist/bigtext-${{ matrix.name }}"
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/bigtext target/${{ matrix.target }}/release/bigtext-cli target/${{ matrix.target }}/release/bigtext-bench \
             target/${{ matrix.target }}/release/gen-testfiles README.md FEATURES.md USAGE.md "$out/"
          if [ "$RUNNER_OS" = Linux ]; then
            cp packaging/linux/bigtext.desktop assets/icon-256.png "$out/"
          fi
          tar -C dist -czf "dist/bigtext-${{ matrix.name }}.tar.gz" "bigtext-${{ matrix.name }}"

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          bash packaging/linux/build-deb.sh "$version" target/${{ matrix.target }}/release "dist/bigtext-${{ matrix.name }}.deb"

      - name: Package AppImage (Linux, optional)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: bash packaging/linux/build-appimage.sh target/${{ matrix.target }}/release "$PWD/dist/bigtext-${{ matrix.name }}.AppImage"

      - name: Package BigText.app (macOS)
        if: runner.os == 'macOS'
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          bash packaging/macos/build-app.sh "$version" target/${{ matrix.target }}/release "dist/bigtext-${{ matrix.name }}.app.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: bigtext-${{ matrix.name }}
          path: |
            dist/bigtext-${{ matrix.name }}
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.app.zip
            dist/*setup*.exe
          if-no-files-found: error

  # The VS Code extension (packaging/vscode): its tests and the .vsix, which the release carries.
  vscode:
    name: vscode-extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/*.test.js

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package -o bigtext-vscode.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: bigtext-vscode
          path: packaging/vscode/bigtext-vscode.vsix
          if-no-files-found: error

  # Starts the AppImage the way the AppImage catalog's test does (Ubuntu 22.04 with its X packages,
  # Xvfb 800x600, icewm, a home without settings) and checks that a window appears, and that it
  # is light, since that system is not set to dark mode. The catalog found v0.7.1 and v0.7.2 not
  # starting only after their release; this finds it on every push. It does not hold up a release.
  appimage-test:
    name: appimage-test
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bigtext-linux-x64
          path: dist

      # The list the catalog's test installs ("packages:" in its log), minus OCR and sound.
      - name: The packages of the catalog's test system
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            sudo imagemagick desktop-file-utils xmlstarlet xsel xterm xvfb icewm x11-utils x11-apps \
            netpbm xdotool libgl1-mesa-dri libgl1-mesa-dev mesa-utils libosmesa6 libsdl1.2-dev \
            libsdl2-2.0-0 fonts-wqy-microhei libfile-mimeinfo-perl >/dev/null

      - name: Start it and look at the window
        run: |
          Xvfb :99 -screen 0 800x600x24 &
          export DISPLAY=:99
          sleep 2
          icewm &
          sleep 2
          export HOME=/tmp/home
          mkdir -p "$HOME"
          chmod +x dist/bigtext-linux-x64.AppImage
          dist/bigtext-linux-x64.AppImage --appimage-extract-and-run > app.log 2>&1 &
          for _ in $(seq 30); do xdotool search --name BigText > /dev/null 2>&1 && break; sleep 1; done
          sleep 3
          import -window root shot.png
          if ! xdotool search --name BigText > /dev/null 2>&1; then
            # Annotations, which the run's page shows without opening the log.
            log="$(head -c 3000 app.log | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"
            windows="$(xwininfo -root -tree | grep -v 'has no name' | head -n 15 | awk '{ printf "%s%%0A", $0 }')"
            echo "::error::No BigText window after 30 s. Its output:%0A$log"
            echo "::warning::Windows on the screen:%0A$windows"
            exit 1
          fi
          # Light theme about 0.6-0.95 (a dialog dims it), dark about 0.1.
          mean="$(convert shot.png -colorspace Gray -format '%[fx:mean]' info:)"
          echo "::notice::BigText window found; mean brightness $mean (light above 0.35)"
          if ! awk -v m="$mean" 'BEGIN { exit !(m > 0.35) }'; then
            echo "::error::The window is dark (mean brightness $mean) on a system not set to dark mode"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appimage-test-screenshot
          path: shot.png
          if-no-files-found: ignore

  # A pushed tag (v0.1.0, ...) publishes a GitHub release. Asset names carry no version so the
  # website can link to releases/latest/download/<name>.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          cp dist/bigtext-windows-x64/*setup*.exe out/bigtext-setup-windows-x64.exe
          (cd dist/bigtext-windows-x64 && zip -qr ../../out/bigtext-windows-x64.zip bigtext-windows-x64)
          cp dist/bigtext-*/bigtext-*.tar.gz out/
          find dist -maxdepth 2 \( -name '*.deb' -o -name '*.AppImage' -o -name '*.AppImage.zsync' -o -name '*.app.zip' -o -name '*.vsix' \) -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
          # The opening lines of the notes; "What's new" is written by hand afterwards
          # (CONTRIBUTING.md → Releasing).
          notes="**BigText** is a free, open-source desktop text editor for **huge files** (1–50+ GB) that never loads a whole file into memory and never freezes.
          Website: [erkinbek.github.io/bigtext](https://erkinbek.github.io/bigtext/) · [Русский](https://erkinbek.github.io/bigtext/ru/) · [O'zbekcha](https://erkinbek.github.io/bigtext/uz/) · [Privacy](https://github.com/Erkinbek/bigtext#privacy)"
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "BigText $GITHUB_REF_NAME" --notes "$notes" --generate-notes

  # Where each release file came from: a signed build provenance attestation ties its SHA-256 to
  # this workflow run, the tag and the commit (`gh attestation verify FILE --repo
  # Erkinbek/bigtext`), and a CycloneDX SBOM lists the Rust libraries (from Cargo.lock). A job of
  # its own, after the release: if it fails, the release, crates.io and winget still go out.
  provenance:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir out

      - name: SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: out/bigtext-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: out/*

      - name: Add the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/bigtext-sbom.cdx.json --repo "$GITHUB_REPOSITORY"

  # Publishes the crate with crates.io trusted publishing (no stored token). Enabled once
  # the repository variable CRATES_IO_PUBLISH is "true"; see README → Releasing.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/v') && vars.CRATES_IO_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Opens a pull request with the new version at microsoft/winget-pkgs. Needs the secret
  # WINGET_TOKEN (classic token with public_repo scope); skipped until the first version,
  # submitted by hand, is merged into winget-pkgs (WinGet Releaser only updates packages).
  winget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check that the package is in winget
        id: listed
        if: env.WINGET_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # winget-pkgs is huge and this endpoint often answers 429 at first, so retry.
          for wait in 5 15 30 60 0; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/e/Erkinbek/BigText)
            case "$status" in
              200) echo "listed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              404) echo "Erkinbek.BigText is not in winget-pkgs yet; the winget submission was skipped."; exit 0 ;;
            esac
            echo "GitHub API returned HTTP $status"
            sleep "$wait"
          done
          exit 1

      - name: Submit the new version to winget
        if: steps.listed.outputs.listed == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Erkinbek.BigText
          installers-regex: 'setup-windows-x64\.exe$'
          release-notes-url: https://github.com/Erkinbek/bigtext/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Skip (no WINGET_TOKEN)
        if: env.WINGET_TOKEN == ''
        run: echo "WINGET_TOKEN is not set; the winget submission was skipped."
