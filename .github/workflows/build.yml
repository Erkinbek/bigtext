name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            test: false # cross-compiled on an arm64 runner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Unit tests
        if: matrix.test
        run: cargo test --lib --target ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/bigtext-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bigtext.exe $out/
          Copy-Item target/${{ matrix.target }}/release/bigtext-bench.exe $out/
          Copy-Item target/${{ matrix.target }}/release/gen-testfiles.exe $out/
          Copy-Item README.md $out/

      - name: Build installer (Windows, optional)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSourceExe="$PWD\target\${{ matrix.target }}\release\bigtext.exe" /O"$PWD\dist" installer\bigtext.iss

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          out="dist/bigtext-${{ matrix.name }}"
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/bigtext target/${{ matrix.target }}/release/bigtext-bench \
             target/${{ matrix.target }}/release/gen-testfiles README.md "$out/"
          tar -C dist -czf "dist/bigtext-${{ matrix.name }}.tar.gz" "bigtext-${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bigtext-${{ matrix.name }}
          path: |
            dist/bigtext-${{ matrix.name }}
            dist/*.tar.gz
            dist/*setup*.exe
          if-no-files-found: error
