name: update

# Brings the formula and the cask to the latest BigText release.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo Erkinbek/bigtext --json tagName --jq .tagName)
          gh release download "$tag" --repo Erkinbek/bigtext --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          python3 .github/update.py "${tag#v}" "$RUNNER_TEMP/SHA256SUMS.txt" Formula/bigtext.rb Casks/bigtext.rb
          if git diff --quiet; then
            echo "Already at $tag."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bigtext ${tag#v}"
          git push
